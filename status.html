<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Статус сборок Rhythm</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1b2430;--mut:#6b7686;--line:#e3e7ee;--ok:#2e9e5b;--run:#3b82f6;--bad:#d64545;--idle:#9aa5b5}
@media(prefers-color-scheme:dark){:root{--bg:#12161c;--card:#1b212b;--tx:#e8edf5;--mut:#93a0b3;--line:#2b3441}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,sans-serif;padding:16px}
main{max-width:640px;margin:0 auto}h1{font-size:20px;margin:4px 0 2px}.sub{color:var(--mut);font-size:13px;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}.name{font-weight:600}.st{font-size:13px;color:var(--mut);white-space:nowrap}
.bar{height:12px;background:var(--line);border-radius:8px;overflow:hidden;margin:10px 0 6px}.fill{height:100%;width:0;background:var(--run);transition:width .6s}
.ok .fill{background:var(--ok)}.bad .fill{background:var(--bad)}.run .fill{background-image:linear-gradient(45deg,rgba(255,255,255,.25) 25%,transparent 25%,transparent 50%,rgba(255,255,255,.25) 50%,rgba(255,255,255,.25) 75%,transparent 75%);background-size:24px 24px;animation:mv 1s linear infinite}
@keyframes mv{to{background-position:24px 0}}
.steps{font-size:12px;color:var(--mut);margin:0;padding:0;list-style:none}.steps li{padding:2px 0}.steps .d::before{content:"✓ ";color:var(--ok)}.steps .r::before{content:"● ";color:var(--run)}.steps .p::before{content:"○ "}.steps .f::before{content:"✕ ";color:var(--bad)}
.meta{font-size:12px;color:var(--mut)}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
button,input{font:inherit;font-size:13px;padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--tx)}input{flex:1;min-width:160px}
</style></head><body><main>
<h1>Статус сборок</h1><div class="sub" id="upd">загрузка…</div>
<div id="list"></div>
<div class="card"><div class="meta">Страница сама обновляется, пока открыта, и не использует ничего, кроме открытого API GitHub. Без токена лимит 60 запросов в час, поэтому опрос раз в 3 минуты. С токеном (только чтение, хранится у вас в браузере) обновление раз в 20 секунд.</div>
<div class="row"><input id="tok" placeholder="GitHub-токен (необязательно)" type="password"><button id="save">Сохранить</button><button id="now">Обновить</button></div></div>
</main>
<script>
const REPO="dmkclaudecode-pixel/ritm", API="https://api.github.com/repos/"+REPO;
// ожидаемая длительность главного шага, мин: для плавной полосы внутри долгого шага
const TYPICAL={"Собрать знания":90,"Собрать статистику":40,"Собрать APK":6};
const $=s=>document.querySelector(s); let tok=""; try{tok=localStorage.getItem("gh")||""}catch(e){} $("#tok").value=tok;
const hdr=()=>tok?{Authorization:"Bearer "+tok}:{};
const j=u=>fetch(u,{headers:hdr()}).then(r=>{if(!r.ok)throw new Error(r.status);return r.json()});
const fmt=s=>{s=Math.max(0,Math.round(s));const m=Math.floor(s/60);return m>=60?Math.floor(m/60)+" ч "+m%60+" мин":m+" мин "+s%60+" с"};
async function tick(){
  try{
    const runs=(await j(API+"/actions/runs?per_page=20")).workflow_runs, seen={}, latest=[];
    for(const r of runs){if(!seen[r.name]){seen[r.name]=1;latest.push(r)}}
    const out=[];
    for(const r of latest.filter(r=>r.name!=="pages build and deployment")){
      let steps=[];
      try{steps=(await j(API+"/actions/runs/"+r.id+"/jobs")).jobs.flatMap(x=>x.steps||[])}catch(e){}
      steps=steps.filter(s=>!/^(Set up job|Post |Complete job)/.test(s.name)&&!/^Run actions\//.test(s.name));
      const done=steps.filter(s=>s.status==="completed").length, n=Math.max(steps.length,1);
      const cur=steps.find(s=>s.status==="in_progress");
      let frac=done/n;
      if(cur&&cur.started_at){const t=Object.entries(TYPICAL).find(([k])=>cur.name.startsWith(k)); const el=(Date.now()-new Date(cur.started_at))/60000; frac+=Math.min(.95,el/(t?t[1]:20))/n}
      const cls=r.status!=="completed"?"run":r.conclusion==="success"?"ok":"bad";
      if(cls!=="run")frac=r.conclusion==="success"?1:frac;
      const el=(r.status==="completed"?new Date(r.updated_at):new Date())-new Date(r.run_started_at||r.created_at);
      const label=r.status!=="completed"?(r.status==="queued"?"в очереди":"идёт"):r.conclusion==="success"?"готово":r.conclusion==="failure"?"ошибка":r.conclusion||"завершено";
      out.push(`<div class="card ${cls}"><div class="top"><span class="name">${r.name}</span><span class="st">${label} · ${fmt(el/1000)}</span></div>
      <div class="bar"><div class="fill" style="width:${Math.round(frac*100)}%"></div></div>
      <div class="meta">${Math.round(frac*100)}%${cur?" · сейчас: "+cur.name:""}</div>
      <ul class="steps">${steps.map(s=>`<li class="${s.status==="completed"?(s.conclusion==="failure"?"f":"d"):s.status==="in_progress"?"r":"p"}">${s.name}</li>`).join("")}</ul></div>`);
    }
    $("#list").innerHTML=out.join("")||"<div class='card'>Сборок пока нет</div>";
    $("#upd").textContent="обновлено в "+new Date().toLocaleTimeString("ru-RU");
  }catch(e){$("#upd").textContent=(e.message==="403"?"лимит запросов GitHub исчерпан, подождите или добавьте токен":"ошибка: "+e.message)}
}
let timer; const loop=()=>{clearTimeout(timer);tick();timer=setTimeout(loop,tok?20000:180000)};
$("#save").onclick=()=>{tok=$("#tok").value.trim();try{localStorage.setItem("gh",tok)}catch(e){}loop()};$("#now").onclick=loop;loop();
</script></body></html>
