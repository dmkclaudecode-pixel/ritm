name: Сборка Android-приложения

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Проверить понимание фраз
        run: node tests/run.js

      - name: Положить интерфейс внутрь приложения
        run: |
          mkdir -p android/app/src/main/assets/www
          cp index.html app.js app.css styles.css catalog.js food.js parser.js nlu.js android/app/src/main/assets/www/
          cp -r icons android/app/src/main/assets/www/

      - name: Собрать APK
        run: |
          set -o pipefail
          gradle -p android assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Сохранить хвост лога при сбое
        if: failure()
        run: |
          grep -iE "error|e: |wrong|could not|unresolved|minSdk|incompatible|metadata|manifest" build.log | head -60 > /tmp/log.txt || true
          J=$(find ~/.gradle -name "litertlm-android-*-api.jar" | head -1); echo "JAR $J" >> /tmp/log.txt
          for c in Conversation Message Content Contents; do javap -cp "$J" com.google.ai.edge.litertlm.$c >> /tmp/log.txt 2>&1 || true; done
          unzip -l "$J" | grep -i "litertlm/" | awk '{print $4}' | head -60 >> /tmp/log.txt || true
          echo "---- tail ----" >> /tmp/log.txt; tail -40 build.log >> /tmp/log.txt || true
          git config user.name ci; git config user.email ci@example.com
          git checkout --orphan ci-log; git rm -rf . -q
          cp /tmp/log.txt log.txt; git add log.txt; git commit -qm "build log"; git push -f origin ci-log

      - name: Переименовать
        run: cp android/app/build/outputs/apk/release/app-release.apk ritm.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ritm-apk
          path: ritm.apk

      - name: Опубликовать для скачивания
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Ритм недели, сборка ${{ github.run_number }}
          body: Скачайте ritm.apk на телефон и установите.
          files: ritm.apk
          make_latest: true
