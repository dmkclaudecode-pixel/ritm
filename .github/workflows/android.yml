name: Сборка Android-приложения

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Проверить понимание фраз
        run: node tests/run.js

      - name: Положить интерфейс внутрь приложения
        run: |
          mkdir -p android/app/src/main/assets/www
          mkdir -p android/app/src/main/assets/www/js && cp js/*.js android/app/src/main/assets/www/js/ && cp index.html core.js app.css styles.css catalog.js catalog2.js food.js food2.js parser.js nlu.js android/app/src/main/assets/www/
          cp -r icons android/app/src/main/assets/www/

      - name: Собрать APK
        run: |
          set -o pipefail
          gradle -p android assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Сохранить хвост лога при сбое
        if: failure()
        run: |
          grep -iE "error|e: |wrong|could not|unresolved|minSdk|incompatible|metadata|manifest" build.log | head -60 > /tmp/log.txt || true
          echo "---- tail ----" >> /tmp/log.txt; tail -40 build.log >> /tmp/log.txt || true
          git config user.name ci; git config user.email ci@example.com
          git checkout --orphan ci-log; git rm -rf . -q
          cp /tmp/log.txt log.txt; git add log.txt; git commit -qm "build log"; git push -f origin ci-log

      - name: Проверить APK
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          { echo "== apksigner"; $BT/apksigner verify --verbose --print-certs android/app/build/outputs/apk/release/app-release.apk 2>&1 | head -20
            echo "== badging"; $BT/aapt dump badging android/app/build/outputs/apk/release/app-release.apk 2>&1 | grep -E "package:|sdkVersion|targetSdk|native-code|uses-" | head -20
            echo "== zip"; unzip -tq android/app/build/outputs/apk/release/app-release.apk | tail -2
            echo "== libs"; unzip -v android/app/build/outputs/apk/release/app-release.apk | grep -E "\.so|AndroidManifest|resources.arsc" | head -30
            echo "== zipalign"; $BT/zipalign -c -P 16 -v 4 android/app/build/outputs/apk/release/app-release.apk 2>&1 | grep -E "FAIL|Verification" | head -10
          } > /tmp/apkcheck.txt 2>&1 || true
          git config user.name ci; git config user.email ci@example.com
          git checkout --orphan ci-apk; git rm -rf . -q; cp /tmp/apkcheck.txt apkcheck.txt; git add apkcheck.txt; git commit -qm apkcheck; git push -f origin ci-apk || true
          git checkout -f main || git checkout -f ${{ github.sha }}

      - name: Переименовать
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk ritm.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ritm-apk
          path: |
            ritm.apk

      - name: Опубликовать для скачивания
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Rhythm, сборка ${{ github.run_number }}
          body: "ritm.apk — приложение Rhythm."
          files: |
            ritm.apk
          make_latest: true
