name: Сборка Android-приложения

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Проверить понимание фраз
        run: node tests/run.js

      - name: Положить интерфейс внутрь приложения
        run: |
          mkdir -p android/app/src/main/assets/www
          cp index.html app.js app.css styles.css catalog.js parser.js nlu.js android/app/src/main/assets/www/
          cp -r icons android/app/src/main/assets/www/

      - name: Собрать APK
        run: gradle -p android assembleRelease --no-daemon --stacktrace

      - name: Переименовать
        run: cp android/app/build/outputs/apk/release/app-release.apk ritm.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ritm-apk
          path: ritm.apk

      - name: Опубликовать для скачивания
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Ритм недели, сборка ${{ github.run_number }}
          body: Скачайте ritm.apk на телефон и установите.
          files: ritm.apk
          make_latest: true
