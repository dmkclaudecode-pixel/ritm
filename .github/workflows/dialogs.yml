name: Диалоги → отфильтрованные пары для языковой части
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install huggingface_hub
      - name: Фильтрация
        run: python tools/build_dialogs.py dialogs
      - name: Положить результат в ветку dialogs-data
        if: always()
        run: |
          git config user.name "knowledge-bot"; git config user.email "bot@users.noreply.github.com"
          mkdir -p /tmp/kd && cp -r dialogs/. /tmp/kd/
          git checkout --orphan dialogs-data && git rm -rf . >/dev/null 2>&1 || true
          cp -r /tmp/kd/. . && git add -A && git commit -m "Диалоги (автосборка)" && git push -f origin dialogs-data
